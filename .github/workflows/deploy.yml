name: Deploy static site to GitHub Pages

on:
  # Uruchamiaj przy każdym pushu na branch main
  push:
    branches: [main]
  # Pozwól odpalić ręcznie z zakładki Actions
  workflow_dispatch:

# Uprawnienia potrzebne do publikacji na Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jeden deployment naraz. Trwajacy deploy dokancza sie,
# a nadmiarowe zakolejkowane runy sa pomijane (nie kasuja sie nawzajem).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Cała strona leży w katalogu głównym repo
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
